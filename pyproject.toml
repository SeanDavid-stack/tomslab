[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tomslab"
version = "0.1.0"
description = "Desktop app to search and study the Bookmap Discord 'traders-lab-tom-b' channel via AI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Tom's Lab contributors" }]
keywords = ["discord", "trading", "bookmap", "rag", "pyqt6"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyQt6>=6.7.0",
    "ijson>=3.2.0",
    "platformdirs>=4.0.0",
    "numpy>=2.0",
    "ollama>=0.4",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
tomslab = "tomslab.main:main"

[project.gui-scripts]
"Tom's Lab" = "tomslab.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

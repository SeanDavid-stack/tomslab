[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tomslab"
version = "1.0.0"
description = "Desktop app to search and study the Bookmap Discord 'traders-lab-tom-b' channel via AI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Tom's Lab contributors" }]
keywords = ["discord", "trading", "bookmap", "rag", "pyqt6"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyQt6>=6.7.0",
    "ijson>=3.2.0",
    "platformdirs>=4.0.0",
    "numpy>=2.0",
    "ollama>=0.4",
    "google-genai>=1.0",
    "Pillow>=10.0",
    "open-clip-torch>=3.0",
    "pypdfium2>=4.0",
    "pdfplumber>=0.11",
    "easyocr>=1.7",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    # torch is installed separately with the CUDA index — see requirements.txt
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
tomslab = "tomslab.main:main"

[project.gui-scripts]
"Tom's Lab" = "tomslab.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
